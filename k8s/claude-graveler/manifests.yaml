apiVersion: v1
kind: Namespace
metadata:
  name: claude-theo-INSTANCE
  labels:
    beam.giantswarm.io/instance: INSTANCE
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-scripts
  namespace: claude-theo-INSTANCE
data:
  start.sh: |
    #!/bin/bash
    set -euo pipefail
    export HOME=/home/node
    export SHELL=/bin/bash
    export LANG=C.UTF-8
    export LC_ALL=C.UTF-8
    cd "$HOME"
    mkdir -p "$HOME/work" "$HOME/.claude"

    # CLAUDE_CONFIG_DIR is in memory: logins and tokens never reach the PVC.
    # Only these non-secret parts link to the PVC.
    mkdir -p "$CLAUDE_CONFIG_DIR"
    for name in projects settings.json CLAUDE.md keybindings.json agents skills plugins; do
      ln -sfn "$HOME/.claude/$name" "$CLAUDE_CONFIG_DIR/$name"
    done
    mkdir -p "$HOME/.claude/projects"

    # PID 1 supervises the daemon and reaps orphaned processes.
    set +e
    cd "$HOME/work"
    dpid=
    while true; do
      if [ -z "$dpid" ] || ! kill -0 "$dpid" 2>/dev/null; then
        claude daemon run &
        dpid=$!
      fi
      sleep 10 & wait $!
    done
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claude
  namespace: claude-theo-INSTANCE
spec:
  serviceName: claude
  replicas: 1
  selector:
    matchLabels:
      app: claude
  template:
    metadata:
      labels:
        app: claude
        beam.giantswarm.io/instance: INSTANCE
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: claude
          # ttl.sh image of images/claude, expires 2026-11-04T22:46Z. Push a new one:
          #   img=ttl.sh/$(cat /proc/sys/kernel/random/uuid):24h
          #   docker build -t "$img" images/claude && docker push "$img"
          image: ttl.sh/0690ef65-ca0f-46da-8c79-24db7cfb4d85:24h
          command: ["/bin/bash", "/scripts/start.sh"]
          env:
            - name: CLAUDE_CONFIG_DIR
              value: /run/claude/config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: scripts
              mountPath: /scripts
            - name: secrets
              mountPath: /run/claude
      volumes:
        - name: home # ephemeral
          emptyDir: # ephemeral
            sizeLimit: 5Gi # ephemeral
        - name: scripts
          configMap:
            name: claude-scripts
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
#persistent   volumeClaimTemplates:
#persistent     - metadata:
#persistent         name: home
#persistent       spec:
#persistent         accessModes: ["ReadWriteOnce"]
#persistent         storageClassName: gp3
#persistent         resources:
#persistent           requests:
#persistent             storage: 20Gi
