apiVersion: v1
kind: Namespace
metadata:
  name: claude-theo-INSTANCE
  labels:
    beam.giantswarm.io/instance: INSTANCE
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: claude-scripts
  namespace: claude-theo-INSTANCE
data:
  start.sh: |
    #!/bin/bash
    set -euo pipefail
    export HOME=/home/node
    export SHELL=/bin/bash
    export LANG=C.UTF-8
    export LC_ALL=C.UTF-8
    cd "$HOME"
    mkdir -p "$HOME/work" "$HOME/.claude"
    export PATH="$HOME/.local/bin:$PATH"

    # Claude Code native binary, persisted on the PVC
    if ! command -v claude >/dev/null; then
      curl -fsSL https://claude.ai/install.sh | bash
    fi

    # CLAUDE_CONFIG_DIR is in memory: logins and tokens never reach the PVC.
    # Only these non-secret parts link to the PVC.
    mkdir -p "$CLAUDE_CONFIG_DIR"
    for name in projects settings.json CLAUDE.md keybindings.json agents skills plugins; do
      ln -sfn "$HOME/.claude/$name" "$CLAUDE_CONFIG_DIR/$name"
    done
    mkdir -p "$HOME/.claude/projects"

    # PID 1 supervises the daemon and reaps orphaned processes.
    set +e
    cd "$HOME/work"
    dpid=
    while true; do
      if [ -z "$dpid" ] || ! kill -0 "$dpid" 2>/dev/null; then
        claude daemon run &
        dpid=$!
      fi
      sleep 10 & wait $!
    done
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claude
  namespace: claude-theo-INSTANCE
spec:
  serviceName: claude
  replicas: 1
  selector:
    matchLabels:
      app: claude
  template:
    metadata:
      labels:
        app: claude
        beam.giantswarm.io/instance: INSTANCE
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: claude
          image: node:22-bookworm
          command: ["/bin/bash", "/scripts/start.sh"]
          env:
            - name: CLAUDE_CONFIG_DIR
              value: /run/claude/config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: scripts
              mountPath: /scripts
            - name: secrets
              mountPath: /run/claude
      volumes:
        - name: home
          emptyDir:
            sizeLimit: 5Gi
        - name: scripts
          configMap:
            name: claude-scripts
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
