apiVersion: v1
kind: Namespace
metadata:
  name: claude-theo-INSTANCE
  labels:
    beam.giantswarm.io/instance: INSTANCE
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: claude
  namespace: claude-theo-INSTANCE
spec:
  serviceName: claude
  replicas: 1
  selector:
    matchLabels:
      app: claude
  template:
    metadata:
      labels:
        app: claude
        beam.giantswarm.io/instance: INSTANCE
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: claude
          # Built from images/claude. Tag = Claude version, then a build suffix.
          # Bump the suffix on any image change. Reset it to 1 when the Claude version changes.
          # Rebuild and push:
          #   docker build -t docker.io/theo01/beam-claude:<tag> images/claude && docker push docker.io/theo01/beam-claude:<tag>
          image: docker.io/theo01/beam-claude:2.1.317-2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: home
              mountPath: /home/node
            - name: secrets
              mountPath: /run/claude
      volumes:
        - name: home # ephemeral
          emptyDir: # ephemeral
            sizeLimit: 5Gi # ephemeral
        - name: secrets
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
#persistent   volumeClaimTemplates:
#persistent     - metadata:
#persistent         name: home
#persistent       spec:
#persistent         accessModes: ["ReadWriteOnce"]
#persistent         storageClassName: gp3
#persistent         resources:
#persistent           requests:
#persistent             storage: 20Gi
